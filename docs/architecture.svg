<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
  <title id="title">ShopLedger architecture and order placement flow</title>
  <desc id="desc">Architecture diagram showing public browser UI, Express server, all route and library modules, configuration, JSON data store, and numbered checkout flow. Invoice and tax modules are highlighted.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/></marker>
    <marker id="flowArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#0f766e"/></marker>
    <style>
      text{font-family:Arial,sans-serif;fill:#172033}.title{font-size:24px;font-weight:700}.sub{font-size:13px;fill:#475569}.h{font-size:16px;font-weight:700}.label{font-size:13px;font-weight:700}.small{font-size:12px;fill:#334155}.tiny{font-size:11px;fill:#475569}.node{fill:#fff;stroke:#94a3b8;stroke-width:1.5}.group{fill:#f8fafc;stroke:#cbd5e1;stroke-width:1.5}.route{fill:#eff6ff;stroke:#60a5fa;stroke-width:1.5}.lib{fill:#f8fafc;stroke:#94a3b8;stroke-width:1.25}.focus{fill:#f5f3ff;stroke:#7c3aed;stroke-width:2.5}.data{fill:#ecfdf5;stroke:#10b981;stroke-width:2}.config{fill:#fff7ed;stroke:#f97316;stroke-width:1.5}.line{stroke:#64748b;stroke-width:1.5;fill:none;marker-end:url(#arrow)}.flow{stroke:#0f766e;stroke-width:2.5;fill:none;marker-end:url(#flowArrow)}.dash{stroke:#94a3b8;stroke-width:1.25;stroke-dasharray:5 4;fill:none;marker-end:url(#arrow)}.step{fill:#0f766e}.stepText{font-size:12px;font-weight:700;fill:#fff}.legend{font-size:12px}.routeText{font-size:12px;fill:#1e3a5f}.focusText{font-size:12px;fill:#4c1d95}</style>
  </defs>
  <rect width="1200" height="800" fill="#ffffff"/>
  <text x="40" y="38" class="title">ShopLedger architecture</text>
  <text x="40" y="59" class="sub">Node/Express POS, Khata credit ledger, GST checkout and printable invoices</text>

  <!-- Browser UI -->
  <rect x="40" y="90" width="190" height="160" rx="10" class="group"/>
  <text x="60" y="118" class="h">Browser UI</text>
  <rect x="58" y="132" width="154" height="96" rx="6" class="node"/>
  <text x="70" y="156" class="label">public/</text>
  <text x="70" y="176" class="small">index.html</text>
  <text x="70" y="195" class="small">js/app.js</text>
  <text x="70" y="214" class="small">css/style.css</text>
  <text x="60" y="244" class="tiny">XHR: /api/* and invoice link</text>

  <!-- Server -->
  <rect x="285" y="90" width="235" height="160" rx="10" class="group"/>
  <text x="305" y="118" class="h">HTTP application</text>
  <rect x="305" y="132" width="195" height="96" rx="6" class="node"/>
  <text x="320" y="157" class="label">server.js</text>
  <text x="320" y="177" class="small">Express + bodyParser.json()</text>
  <text x="320" y="196" class="small">static public/; mounts /api</text>
  <text x="320" y="215" class="small">GET /orders/:id/invoice</text>

  <!-- Routes -->
  <rect x="575" y="90" width="585" height="160" rx="10" class="group"/>
  <text x="595" y="118" class="h">routes/ — mounted at /api</text>
  <rect x="595" y="132" width="128" height="94" rx="6" class="route"/>
  <text x="607" y="154" class="label">products.js</text><text x="607" y="174" class="routeText">GET products</text><text x="607" y="193" class="routeText">GET coupons</text>
  <rect x="738" y="132" width="128" height="94" rx="6" class="route"/>
  <text x="750" y="154" class="label">orders.js</text><text x="750" y="174" class="routeText">GET/POST orders</text><text x="750" y="193" class="routeText">POST cancel</text>
  <rect x="881" y="132" width="128" height="94" rx="6" class="route"/>
  <text x="893" y="154" class="label">customers.js</text><text x="893" y="174" class="routeText">GET customers</text><text x="893" y="193" class="routeText">POST settle</text>
  <rect x="1024" y="132" width="118" height="94" rx="6" class="route"/>
  <text x="1036" y="154" class="label">reports.js</text><text x="1036" y="174" class="routeText">dashboard</text><text x="1036" y="193" class="routeText">preview/export</text>

  <!-- Wiring arrows -->
  <path d="M230 170 L305 170" class="line"/>
  <path d="M520 170 L575 170" class="line"/>
  <path d="M402 250 L402 276 L1045 276 L1045 334" class="dash"/>
  <text x="690" y="271" class="tiny">invoice endpoint calls invoice.render(order)</text>

  <!-- libraries -->
  <rect x="40" y="300" width="815" height="360" rx="10" class="group"/>
  <text x="60" y="328" class="h">lib/ — business logic</text>
  <rect x="60" y="345" width="145" height="78" rx="6" class="lib"/><text x="72" y="367" class="label">store.js</text><text x="72" y="387" class="small">read, write,</text><text x="72" y="405" class="small">appendAudit</text>
  <rect x="222" y="345" width="145" height="78" rx="6" class="lib"/><text x="234" y="367" class="label">orders.js</text><text x="234" y="387" class="small">add, get, cancel,</text><text x="234" y="405" class="small">list</text>
  <rect x="384" y="345" width="145" height="78" rx="6" class="lib"/><text x="396" y="367" class="label">inventory.js</text><text x="396" y="387" class="small">find, check, reserve,</text><text x="396" y="405" class="small">release, summarize</text>
  <rect x="546" y="345" width="145" height="78" rx="6" class="lib"/><text x="558" y="367" class="label">coupons.js</text><text x="558" y="387" class="small">normalizeCode,</text><text x="558" y="405" class="small">validate, calculateDiscount</text>
  <rect x="708" y="345" width="127" height="78" rx="6" class="lib"/><text x="720" y="367" class="label">pricing.js</text><text x="720" y="387" class="small">subtotal, discount,</text><text x="720" y="405" class="small">computeTotals</text>
  <rect x="60" y="446" width="145" height="78" rx="6" class="lib"/><text x="72" y="468" class="label">ledger.js</text><text x="72" y="488" class="small">findCustomer, charge,</text><text x="72" y="506" class="small">settle, reverse</text>
  <rect x="222" y="446" width="145" height="78" rx="6" class="focus"/><text x="234" y="468" class="label">invoice.js</text><text x="234" y="488" class="focusText">computeInvoiceFigures,</text><text x="234" y="506" class="focusText">render</text>
  <rect x="384" y="446" width="145" height="78" rx="6" class="focus"/><text x="396" y="468" class="label">tax.js</text><text x="396" y="488" class="focusText">getRateForItem,</text><text x="396" y="506" class="focusText">getSlabPercent, splitCgstSgst</text>
  <rect x="546" y="446" width="145" height="78" rx="6" class="lib"/><text x="558" y="468" class="label">reports.js</text><text x="558" y="488" class="small">getDashboardSummary,</text><text x="558" y="506" class="small">getGstReconciliation</text>
  <rect x="708" y="446" width="127" height="78" rx="6" class="lib"/><text x="720" y="468" class="label">dates.js</text><text x="720" y="488" class="small">today, normalizeDateKey,</text><text x="720" y="506" class="small">getFiscalYear</text>
  <path d="M781 423 L781 446" class="line"/><text x="791" y="440" class="tiny">uses tax + coupons</text>
  <path d="M765 524 L455 562" class="dash"/><text x="560" y="554" class="tiny">tax + coupons read config</text>

  <!-- config and data -->
  <rect x="895" y="300" width="265" height="135" rx="10" class="config"/>
  <text x="915" y="328" class="h">config.js</text>
  <text x="915" y="351" class="small">port; shop details</text>
  <text x="915" y="371" class="small">tax.hsnSlabs; defaultRate</text>
  <text x="915" y="391" class="small">inventory defaults; coupons</text>
  <text x="915" y="411" class="small">adminKey</text>
  <rect x="895" y="470" width="265" height="190" rx="10" class="data"/>
  <text x="915" y="498" class="h">data/db.json</text>
  <text x="915" y="522" class="small">products + stock/reserved</text>
  <text x="915" y="543" class="small">customers + credit totals</text>
  <text x="915" y="564" class="small">orders + computed totals</text>
  <text x="915" y="585" class="small">settlements + auditLog</text>
  <text x="915" y="606" class="small">nextOrderId; nextSettlementId</text>
  <path d="M855 384 L895 367" class="dash"/>
  <path d="M205 384 L895 555" class="line"/>
  <text x="658" y="514" class="tiny">store.read() / store.write()</text>

  <!-- flow -->
  <rect x="40" y="690" width="1120" height="82" rx="10" fill="#f0fdfa" stroke="#5eead4" stroke-width="1.5"/>
  <text x="60" y="714" class="h">Numbered flow — POST /api/orders</text>
  <circle cx="310" cy="739" r="12" class="step"/><text x="306" y="744" class="stepText">1</text><text x="329" y="744" class="small">UI posts item IDs / qty / coupon</text>
  <path d="M500 739 L535 739" class="flow"/>
  <circle cx="550" cy="739" r="12" class="step"/><text x="546" y="744" class="stepText">2</text><text x="569" y="744" class="small">orders.js loads products, validates stock + coupon</text>
  <path d="M795 739 L830 739" class="flow"/>
  <circle cx="845" cy="739" r="12" class="step"/><text x="841" y="744" class="stepText">3</text><text x="864" y="744" class="small">pricing/tax compute totals; ledger + inventory update; store writes JSON</text>

  <!-- Legend -->
  <rect x="915" y="90" width="245" height="25" rx="5" fill="#ffffff" stroke="#cbd5e1"/>
  <rect x="925" y="98" width="14" height="10" rx="2" class="focus"/><text x="946" y="108" class="legend">Ticket focus: invoice.js + tax.js</text>
</svg>
